# Budowa wydania: po wypchnięciu tagu v* (np. v1.0.0) GitHub buduje wersje
# Windows i Linux i dołącza je do strony wydania (Releases).
name: Wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteki
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3 -r requirements-desktop.txt
      - name: Program (folder do instalatora)
        run: pyinstaller --noconfirm --clean --workpath build/win --distpath dist-win packaging/windows/niezapominajka.spec
      - name: Wersja przenośna (jeden plik)
        shell: pwsh
        run: |
          $env:NZ_ONEFILE = "1"
          pyinstaller --noconfirm --workpath build/win1 --distpath dist-win packaging/windows/niezapominajka.spec
          $ver = (Select-String -Path app/config.py -Pattern '^APP_VERSION = "(.*)"').Matches[0].Groups[1].Value
          Move-Item dist-win/Niezapominajka-przenosna.exe "dist-win/Niezapominajka-$ver-przenosna.exe"
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-win/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: AppImage i paczka serwerowa
        run: bash packaging/linux/build_linux.sh dist
      - name: Próba uruchomienia
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract-and-run --wersja
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sumy kontrolne
        run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
